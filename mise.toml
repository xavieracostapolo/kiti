[tools]
node = "24.22.1"
pnpm = "12.15.0"
cargo-deny = "0.20.2"

[tasks.gen-types]
description = "Genera los tipos TS del protocolo desde crates/protocol (ts-rs)"
run = "cargo test -p kiti-protocol export_bindings"

[tasks."ui:dev"]
description = "Levanta la UI en modo sim en http://127.0.0.1:5173"
run = "pnpm -C ui dev --host 127.0.0.1 --port 5173 --strictPort"

[tasks."ui:test"]
description = "Tests unitarios de la UI (Vitest)"
run = "pnpm -C ui test"

[tasks."ui:e2e"]
description = "E2E funcionales (Playwright, Chromium)"
run = "pnpm -C ui exec playwright test --project=chromium"

[tasks."ui:visual"]
description = "Regresión visual (solo macOS, WebKit)"
run = "pnpm -C ui exec playwright test --project=webkit-visual"

[tasks."ui:shots"]
description = "Capturas far/mid/near/focus3 en ui/.shots/ (necesita ui:dev levantado)"
run = "pnpm -C ui shots"

[tasks."ui:perf"]
description = "Benchmark de 50 agentes (local, WebKit headed)"
run = "pnpm -C ui exec playwright test --project=webkit-perf"

[tasks."app:dev"]
description = "Abre la app nativa (Tauri) con los agentes reales de esta máquina"
run = "pnpm exec tauri dev"

[tasks."app:sim"]
description = "Abre la app nativa con 20 agentes simulados; KITI_SIM=N:SEED[:freeze] para cambiarlo"
env = { KITI_SIM = "20:42" }
run = "pnpm exec tauri dev"

[tasks."hooks:status"]
description = "Estado de los hooks de Kiti en Claude, Codex y Gemini"
run = "cargo run -q -p kiti-core --example hooks -- status"

[tasks."hooks:install-codex"]
description = "Instala los hooks de Kiti en ~/.codex/hooks.json (solo si usas Codex CLI)"
run = "cargo build -q --release -p kiti-forwarder && cargo run -q -p kiti-core --example hooks -- install-codex target/release/kiti-hook"

[tasks."hooks:install-gemini"]
description = "Instala los hooks de Kiti en ~/.gemini/settings.json (solo si usas Gemini CLI)"
run = "cargo build -q --release -p kiti-forwarder && cargo run -q -p kiti-core --example hooks -- install-gemini target/release/kiti-hook"

[tasks."hooks:install-antigravity"]
description = "Instala los hooks de Kiti en ~/.gemini/config/hooks.json (Antigravity CLI, ADR 0014)"
run = "cargo build -q --release -p kiti-forwarder && cargo run -q -p kiti-core --example hooks -- install-antigravity target/release/kiti-hook"

[tasks."statusline:install"]
description = "La status line de Claude pasa por Kiti para leer la cuota (ADR 0015); la tuya se sigue viendo igual"
run = "cargo build -q --release -p kiti-forwarder && cargo run -q -p kiti-core --example hooks -- install-statusline target/release/kiti-hook"

[tasks."statusline:uninstall"]
description = "Restaura tu status line de Claude original"
run = "cargo run -q -p kiti-core --example hooks -- uninstall-statusline"

[tasks."mcp:install"]
description = "Registra kiti-mcp (mensajes entre agentes, ADR 0017) en Claude, Antigravity y Codex"
run = """
cargo build -q --release -p kiti-mcp
mkdir -p ~/.kiti/bin
# Copia y renombra: sobrescribir un binario en uso mataría a los kiti-mcp ya abiertos.
cp target/release/kiti-mcp ~/.kiti/bin/.kiti-mcp.new && mv -f ~/.kiti/bin/.kiti-mcp.new ~/.kiti/bin/kiti-mcp
MCP="$HOME/.kiti/bin/kiti-mcp"
if command -v claude >/dev/null; then
  claude mcp remove -s user kiti >/dev/null 2>&1 || true
  claude mcp add -s user kiti -- "$MCP" && echo "Claude Code: listo"
fi
if command -v agy >/dev/null; then
  agy mcp add kiti "$MCP" && echo "Antigravity: listo"
fi
if command -v codex >/dev/null; then
  codex mcp remove kiti >/dev/null 2>&1 || true
  codex mcp add kiti -- "$MCP" && echo "Codex: listo"
fi
echo "Los agentes que ya estaban abiertos lo verán al reiniciarlos."
"""

[tasks."mcp:uninstall"]
description = "Quita kiti-mcp de Claude, Antigravity y Codex"
run = """
command -v claude >/dev/null && claude mcp remove -s user kiti || true
command -v agy >/dev/null && agy mcp remove kiti || true
command -v codex >/dev/null && codex mcp remove kiti || true
"""

[tasks."hooks:uninstall"]
description = "Quita los hooks de Kiti de ~/.claude/settings.json (deja los tuyos intactos)"
run = "cargo run -q -p kiti-core --example hooks -- uninstall"

[tasks.scan]
description = "Muestra qué procesos detecta Kiti como agentes y por qué (solo lectura)"
run = "cargo run -q -p kiti-core --example scan"

[tasks."app:build"]
description = "Compila la app nativa en release sin empaquetar: target/release/kiti-app"
run = "pnpm exec tauri build --no-bundle"

[tasks."app:bundle"]
description = "Genera Kiti.app y la copia al Escritorio (sustituye la anterior)"
run = [
  "pnpm exec tauri build --bundles app",
  "rm -rf ~/Desktop/Kiti.app",
  "cp -R target/release/bundle/macos/Kiti.app ~/Desktop/",
  "cargo build -q --release -p kiti-mcp -p kiti-forwarder",
  "mkdir -p ~/.kiti/bin",
  # Copia y renombra: sobrescribir un binario en uso mataría a los procesos ya abiertos.
  "cp target/release/kiti-mcp ~/.kiti/bin/.kiti-mcp.new && mv -f ~/.kiti/bin/.kiti-mcp.new ~/.kiti/bin/kiti-mcp",
  "if [ -e ~/.kiti/bin/kiti-hook ]; then cp target/release/kiti-hook ~/.kiti/bin/.kiti-hook.new && mv -f ~/.kiti/bin/.kiti-hook.new ~/.kiti/bin/kiti-hook; fi",
  "echo 'kiti-mcp y kiti-hook actualizados: los agentes abiertos siguen con el anterior hasta reiniciar su sesión.'",
]

[tasks."app:measure"]
description = "RAM y CPU de la app release con 20 (reposo y activa) y 50 agentes simulados"
depends = ["app:build"]
run = [
  "node scripts/measure.mjs --sim=20:42:freeze",
  "node scripts/measure.mjs --sim=20:42",
  "node scripts/measure.mjs --sim=50:1",
  "node scripts/measure.mjs --sim=live",
]

[tasks.deny]
description = "Advisories, licencias y orígenes de las dependencias Rust (cargo-deny)"
run = "cargo deny check"

[tasks.check]
description = "Todo lo que debe estar en verde antes de un commit"
run = [
  "cargo fmt --all --check",
  "cargo deny check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
  "cargo build -p kiti-core --no-default-features",
  "pnpm -C ui exec biome ci .",
  "pnpm -C ui typecheck",
  "pnpm -C ui test --coverage",
  "pnpm -C ui exec playwright test --project=chromium",
]
