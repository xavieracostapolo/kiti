# cargo-deny (ADR 0004 §2, supply chain). Se ejecuta con `mise run deny` y en CI.

[graph]
all-features = true

[advisories]
# Cualquier advisory de RustSec (vulnerabilidad, unmaintained, yanked) falla el check.
yanked = "deny"
ignore = [
  "RUSTSEC-2024-0370", # proc-macro-error unmaintained, transitivo de gtk/glib en Tauri
  "RUSTSEC-2026-0370", # zvariant unmaintained: zbus (D-Bus, solo Linux) de notify-rust (ADR 0010)
  "RUSTSEC-2026-0371", # zbus_names unmaintained: ídem
  "RUSTSEC-2026-0372", # zvariant_derive unmaintained: ídem
]

[licenses]
confidence-threshold = 0.9
# Lista permitida para dependencias futuras (Tauri, axum…); no avisar si alguna aún no aparece.
unused-allowed-license = "allow"
# Los crates propios no se publican (publish = false) y el proyecto aún no tiene licencia elegida.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
