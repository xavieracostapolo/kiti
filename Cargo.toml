[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
kiti-protocol = { path = "crates/protocol" }
kiti-core = { path = "crates/core", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = "12.0.1"
thiserror = "2.0.21"
smallvec = "1.16"
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1.44"
hdrhistogram = "7.6.0"
rand = "0.10.3"
rand_chacha = "0.10.0"
