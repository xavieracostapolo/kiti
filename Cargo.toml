[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
kiti-protocol = { path = "crates/protocol" }
kiti-core = { path = "crates/core", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = "12.0.1"
thiserror = "2.0.21"
smallvec = "1.16"
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
anyhow = "1.0.104"
hdrhistogram = "7.6.0"
rand = "0.10.3"
rand_chacha = "0.10.0"
tauri = { version = "2.12.5", default-features = false, features = ["wry"] }
tauri-build = "2.7.4"
tauri-plugin-dialog = "2.8.3"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
