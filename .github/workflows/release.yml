# Release de Kiti.app para macOS: binario universal (arm64 + x86_64) firmado con Developer ID,
# notarizado y grapado. Un tag vX.Y.Z crea un release en borrador; en un PR solo se compila sin firmar.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Info.plist"
      - "src-tauri/entitlements.plist"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: universal-apple-darwin

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.TARGET }}
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile

      - name: El tag coincide con la versión de tauri.conf.json
        if: env.SIGN == 'true'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión $version"
            exit 1
          fi

      - name: Están todos los secrets de firma y notarización
        if: env.SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Falta el secret $name"; missing=1; fi
          done
          exit $missing

      # Tauri importa el certificado en un llavero temporal, firma con hardened runtime,
      # notariza Kiti.app y grapa el ticket.
      - name: Compilar, firmar y notarizar
        if: env.SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec tauri build --target "$TARGET" --bundles app,dmg

      - name: Compilar sin firmar
        if: env.SIGN != 'true'
        run: pnpm exec tauri build --target "$TARGET" --bundles app,dmg

      - name: Localizar los artefactos
        run: |
          bundle="target/$TARGET/release/bundle"
          echo "APP=$bundle/macos/Kiti.app" >> "$GITHUB_ENV"
          echo "DMG=$(ls "$bundle"/dmg/*.dmg)" >> "$GITHUB_ENV"
          lipo -archs "$bundle/macos/Kiti.app/Contents/MacOS/kiti-app"

      # El DMG también se notariza y se grapa: así Gatekeeper lo acepta al abrirlo sin conexión.
      - name: Notarizar el DMG
        if: env.SIGN == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"

      - name: Verificar firma, notarización y entitlements
        if: env.SIGN == 'true'
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - --xml "$APP" | grep -q com.apple.security.automation.apple-events
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

      - name: Empaquetar
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist
          cp "$DMG" "dist/Kiti_${version}_universal.dmg"
          ditto -c -k --keepParent "$APP" "dist/Kiti_${version}_universal.app.zip"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Crear el release en borrador
        if: env.SIGN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --generate-notes --title "Kiti $GITHUB_REF_NAME"

      - name: Subir la compilación sin firmar
        if: env.SIGN != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kiti-unsigned-${{ github.sha }}
          path: dist
          retention-days: 7
