# Release de Kiti.app para macOS: binario universal (arm64 + x86_64). Un tag vX.Y.Z crea un
# release en borrador. Con los secrets de Apple, la app sale firmada con Developer ID, notarizada
# y grapada; sin ellos, con firma ad-hoc (docs/release.md). En un PR solo se compila (ad-hoc).
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/release-notes-adhoc.md"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Info.plist"
      - "src-tauri/entitlements.plist"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: universal-apple-darwin

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.TARGET }}
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile

      - name: El tag coincide con la versión de tauri.conf.json
        if: env.RELEASE == 'true'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión $version"
            exit 1
          fi

      # developer-id solo en un tag y con los seis secrets; si falta alguno pero hay certificado,
      # se falla en lugar de publicar sin firmar por error.
      - name: Elegir la firma
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mode=adhoc
          if [ "$RELEASE" = true ] && [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!name}" ]; then echo "::error::Hay APPLE_CERTIFICATE pero falta el secret $name"; exit 1; fi
            done
            mode=developer-id
          fi
          echo "MODE=$mode" >> "$GITHUB_ENV"
          echo "Firma: $mode"

      # Tauri importa el certificado en un llavero temporal, firma con hardened runtime,
      # notariza Kiti.app y grapa el ticket.
      - name: Compilar, firmar con Developer ID y notarizar
        if: env.MODE == 'developer-id'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec tauri build --target "$TARGET" --bundles app,dmg

      # "-" es la identidad ad-hoc: Apple Silicon exige al menos esta firma para ejecutar.
      - name: Compilar con firma ad-hoc
        if: env.MODE == 'adhoc'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm exec tauri build --target "$TARGET" --bundles app,dmg

      - name: Localizar los artefactos
        run: |
          bundle="target/$TARGET/release/bundle"
          echo "APP=$bundle/macos/Kiti.app" >> "$GITHUB_ENV"
          echo "DMG=$(ls "$bundle"/dmg/*.dmg)" >> "$GITHUB_ENV"
          lipo -archs "$bundle/macos/Kiti.app/Contents/MacOS/kiti-app"

      # El DMG también se notariza y se grapa: así Gatekeeper lo acepta al abrirlo sin conexión.
      - name: Notarizar el DMG
        if: env.MODE == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"

      - name: Verificar la firma
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|Signature|Authority|flags"
          codesign -d --entitlements - --xml "$APP" | grep -q com.apple.security.automation.apple-events

      - name: Verificar Gatekeeper y la notarización
        if: env.MODE == 'developer-id'
        run: |
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

      - name: Empaquetar
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist
          cp "$DMG" "dist/Kiti_${version}_universal.dmg"
          ditto -c -k --keepParent "$APP" "dist/Kiti_${version}_universal.app.zip"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Crear el release en borrador
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=()
          if [ "$MODE" = adhoc ]; then notes=(--notes-file .github/release-notes-adhoc.md); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${notes[@]}" \
            --draft --verify-tag --generate-notes --title "Kiti $GITHUB_REF_NAME"

      - name: Subir la compilación de prueba
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kiti-adhoc-${{ github.sha }}
          path: dist
          retention-days: 7
